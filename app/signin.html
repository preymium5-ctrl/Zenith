<script>
document.addEventListener('DOMContentLoaded', function() {
  var form = document.querySelector('form');
  if (form) {
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      showToast('Mockup Preview — Account management is in demonstration mode.');
    });
  }

  document.querySelectorAll('button[type="submit"]').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      showToast('Mockup Preview — Developer platform authentication preview.');
    });
  });

  function showToast(msg) {
    var existing = document.getElementById('auth-mockup-toast');
    if (existing) existing.remove();
    var t = document.createElement('div');
    t.id = 'auth-mockup-toast';
    t.textContent = msg;
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#18181b;color:#fff;padding:12px 24px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,0.6);z-index:999999;transition:all 0.3s ease;font-family:sans-serif;';
    document.body.appendChild(t);
    setTimeout(function() {
      t.style.opacity = '0';
      setTimeout(function() { t.remove(); }, 300);
    }, 3000);
  }
});
</script>
